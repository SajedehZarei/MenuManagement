<svg width="0" height="0" class="absolute" aria-hidden="true">
  <defs>
    <filter id="sticker" x="-20%" y="-20%" width="140%" height="140%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="3" result="d" />
      <feFlood flood-color="#fffaf0" result="w" />
      <feComposite in="w" in2="d" operator="in" result="outline" />
      <feDropShadow in="outline" dx="0" dy="3" stdDeviation="2.5" flood-color="#552a12" flood-opacity="0.28" result="o2" />
      <feMerge>
        <feMergeNode in="o2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
</svg>

<div class="m-2 overflow-clip rounded-3xl bg-cream sm:m-6">
  <header class="mx-auto flex max-w-6xl items-center justify-between gap-4 border-b border-ink/10 px-5 py-5">
    <a routerLink="/" class="font-display text-3xl font-black tracking-tight text-ink" dir="ltr">ROSJA</a>

    <nav class="hidden items-center gap-8 text-sm font-medium text-ink md:flex">
      <a routerLink="/" routerLinkActive="text-olive" [routerLinkActiveOptions]="{ exact: true }" class="transition hover:text-olive">خانه</a>
      <a routerLink="/menu" routerLinkActive="text-olive" class="transition hover:text-olive">منو</a>
      <a href="#about" class="transition hover:text-olive">درباره ما</a>
      <a href="#contact" class="transition hover:text-olive">تماس</a>
    </nav>

    <a routerLink="/cart" aria-label="سبد خرید"
       class="relative flex items-center gap-2 rounded-full bg-olive py-2.5 ps-5 pe-4 text-sm font-bold text-cream shadow-soft transition hover:bg-accent-dark">
      سبد خرید
      <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5 8h14l-1.2 11a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8L5 8Z" /><path d="M9 8V6a3 3 0 0 1 6 0v2" />
      </svg>
      @if (cart.count() > 0) {
        <span class="absolute -top-2 -end-1 flex min-w-6 items-center justify-center rounded-full bg-ink px-1.5 py-0.5 text-[11px] leading-none text-cream ring-2 ring-cream">
          {{ cart.count().toLocaleString('fa-IR') }}
        </span>
      }
    </a>
  </header>

  <main>
    <router-outlet />
  </main>

  <footer id="contact" class="bg-olive text-cream">
    <div id="about" class="mx-auto grid max-w-6xl gap-6 px-5 py-10 text-sm sm:grid-cols-3">
      <div>
        <p class="font-display text-2xl font-black" dir="ltr">ROSJA</p>
        <p class="mt-2 leading-7 text-cream/70">قهوه‌ی خوب، حال خوب.</p>
      </div>
      <div>
        <p class="font-bold">ساعت کاری</p>
        <p class="mt-2 text-cream/70">همه روزه ۸ صبح تا ۱۰ شب</p>
      </div>
      <div>
        <p class="font-bold">تماس</p>
        <p class="mt-2 text-cream/70">آدرس و شماره تماس خود را اینجا بنویسید</p>
      </div>
    </div>
    <p class="border-t border-cream/15 py-4 text-center text-xs text-cream/60">
      © {{ year }} Rosja — همه حقوق محفوظ است
    </p>
  </footer>
</div>
